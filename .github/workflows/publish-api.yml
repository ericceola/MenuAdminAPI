name: Publicar API MenuAdminAPI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Restaurar dependências
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Executar testes
      run: dotnet test --configuration Release --no-build --verbosity normal || true
    
    - name: Publicar API
      run: dotnet publish src/Presentation/MenuAdminAPI.Presentation.csproj --configuration Release --output ./publish
    
    - name: Upload artefatos
      uses: actions/upload-artifact@v4
      with:
        name: api-publish-${{ github.run_number }}
        path: ./publish
        retention-days: 30
